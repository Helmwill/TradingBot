name: Deploy QA

on:
  workflow_run:
    workflows:
      - Deploy Dev
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: Helmwill/DevOps-Platform/.github/workflows/deploy-qa.yml@main
    with:
      image_name: tradingbot
      smoke_script: scripts/smoke.sh
    secrets: inherit
