name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.REGISTRY_USER }}/tradingbot:dev
            ghcr.io/${{ secrets.REGISTRY_USER }}/tradingbot:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS (dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker network create platform-net 2>/dev/null || true
            cd /opt/tradingbot
            docker compose pull tradingbot celery-worker celery-beat
            ENVIRONMENT=development docker compose up -d tradingbot celery-worker celery-beat
            sleep 10
            SMOKE_BASE_URL=http://localhost:8000 bash scripts/smoke.sh
