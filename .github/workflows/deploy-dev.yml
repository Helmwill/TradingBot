name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.REGISTRY_USER }}/tradingbot:dev
            ghcr.io/${{ secrets.REGISTRY_USER }}/tradingbot:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Deploy to VPS (dev)
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IBKR_USERNAME: ${{ secrets.IBKR_USERNAME }}
          IBKR_PASSWORD: ${{ secrets.IBKR_PASSWORD }}
          IBKR_PORT: ${{ secrets.IBKR_PORT }}
          IBKR_CLIENT_ID: ${{ secrets.IBKR_CLIENT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DJANGO_SECRET_KEY,DB_PASSWORD,IBKR_USERNAME,IBKR_PASSWORD,IBKR_PORT,IBKR_CLIENT_ID
          script: |
            set -e
            docker network create platform-net 2>/dev/null || true
            cd ~/srv/projects/TradingBot
            git fetch origin dev && git reset --hard origin/dev
            printf '%s\n' \
              "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "IBKR_USERNAME=$IBKR_USERNAME" \
              "IBKR_PASSWORD=$IBKR_PASSWORD" \
              "IBKR_PORT=${IBKR_PORT:-4002}" \
              "IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-1}" \
              > .env
            docker compose pull tradingbot celery-worker celery-beat
            ENVIRONMENT=development docker compose up -d tradingbot celery-worker celery-beat
            docker compose exec -T tradingbot python manage.py migrate --noinput
            echo "Waiting for tradingbot to be healthy..."
            for i in $(seq 1 30); do
              curl -sf http://localhost:8000/health/ && break || sleep 3
            done
            SMOKE_BASE_URL=http://localhost:8000 bash scripts/smoke.sh

      - name: Deploy skipped — VPS_HOST not configured
        if: ${{ env.VPS_HOST == '' }}
        run: echo "VPS_HOST secret not set. Add VPS_HOST, VPS_USER, and VPS_SSH_KEY secrets to enable deployment."
