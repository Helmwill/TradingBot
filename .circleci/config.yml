version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Print working directory and list contents
          command: |
            echo "Current working directory:"
            pwd
            echo "Listing contents of the working directory:"
            ls -al
            echo "Listing contents of the app directory:"
            ls -al app
      - run:
          name: Set up virtual environment
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run migrations
          command: |
            cd app
            . ../venv/bin/activate
            python manage.py migrate

workflows:
  build_and_test:
    jobs:
      - build:
          context: aws_dev
