version: 2.1


orbs:
  aws-s3: circleci/aws-s3@4.0.0
  aws-cli: circleci/aws-cli@3.1.3

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Set up virtual environment
          command: |
            python -m venv /project/practice_route/venv
            . /project/practice_route/venv/bin/activate
            pip install --upgrade pip
            pip install -r project/practice_route/requirements.txt
      - run:
          name: Run migrations
          command: |
            . /project/practice_route/venv/bin/activate
            python /project/practice_route/app/manage.py migrate

workflows:
  build_and_test:
    jobs:
      - build:
          context: aws_dev
