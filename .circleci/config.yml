version: 2.1

orbs:
  aws-s3: circleci/aws-s3@4.0.0
  aws-cli: circleci/aws-cli@3.1.3

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - aws-cli/setup:
          profile-name: aws-rds-profile
      - run:
          name: Print AWS CLI version
          command: aws --version
      - run:
          name: Set up virtual environment
          command: |
            cd practice_route 
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run migrations
          command: |
            cd practice_route/app  
            . ../venv/bin/activate  
            python manage.py migrate
workflows:
  build_and_test:
    jobs:
      - build:
          context: aws_dev



version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Set up virtual environment
          command: |
            cd practice_route  # Change to the correct directory where requirements.txt is located
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run migrations
          command: |
            cd practice_route/app  # Change to the app directory where manage.py is located
            . ../venv/bin/activate  # Activate the virtual environment from the practice_route directory
            python manage.py migrate

workflows:
  build_and_test:
    jobs:
      - build:
          context: aws_dev
