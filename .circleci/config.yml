version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: List directory contents after checkout
          command: |
            echo "Listing contents of the working directory:"
            ls -al
            echo "Listing contents of the practice_route directory (if it exists):"
            ls -al practice_route || echo "practice_route does not exist"
      - run:
          name: Set up virtual environment
          command: |
            cd practice_route
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run migrations
          command: |
            cd practice_route/app
            . ../venv/bin/activate
            python manage.py migrate

workflows:
  build_and_test:
    jobs:
      - build:
          context: aws_dev
